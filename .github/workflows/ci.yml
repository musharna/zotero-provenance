name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install jq and coreutils (macOS)
        if: runner.os == 'macOS'
        run: brew install jq coreutils
      - name: Install the plugin with its dev extras
        run: python -m pip install -e ".[dev]" ruff
      - name: Lint
        run: ruff check scripts tests dev
      - name: Test (network-free; the live suite is opt-in with -m live)
        run: python -m pytest -q -p no:cacheprovider
