[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-provenance"
version = "0.62.2"
description = "Record the sources a Claude Code session cites into a Zotero collection"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "musharna" }]
requires-python = ">=3.10"
keywords = ["zotero", "claude-code", "provenance", "citations", "bibliography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "httpx>=0.24",
    "beautifulsoup4>=4.11",
    # IDNA-encodes hostnames before the SSRF guard compares them. Imported at
    # startup and was missing from this list for 61 releases while the README
    # named it; a guard test now derives this list from the imports.
    "idna>=3.4",
    "markdown-it-py>=2.2",
    # markdown-it-py's own linkifier. It decides where a bare URL ends in
    # prose; three hand-rolled attempts at that boundary each shipped a
    # silent corruption.
    "linkify-it-py>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "respx>=0.20"]

[project.urls]
Homepage = "https://github.com/musharna/zotero-provenance"
Changelog = "https://github.com/musharna/zotero-provenance/blob/master/CHANGELOG.md"
Issues = "https://github.com/musharna/zotero-provenance/issues"

# The package lives under scripts/ so the hooks can run it from the plugin
# root without an install; this makes `pip install -e .` work as well.
[tool.setuptools.packages.find]
where = ["scripts"]
include = ["zotero_capture*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
# The README promises `pytest -q` needs no network. It did not: the live title
# fetches carry their own fixture and never checked an opt-in, so a bare run hit
# the internet and failed under unrelated load. Opt in with `-m live`.
addopts = '-m "not live"'
