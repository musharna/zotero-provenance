[project]
name = "zotero-provenance"
version = "0.53.0"
description = "Record the sources a Claude Code session cites into a Zotero collection"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24",
    "beautifulsoup4>=4.11",
    "markdown-it-py>=2.2",
    # markdown-it-py's own linkifier. It decides where a bare URL ends in
    # prose; three hand-rolled attempts at that boundary each shipped a
    # silent corruption.
    "linkify-it-py>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "respx>=0.20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
# The README promises `pytest -q` needs no network. It did not: the live title
# fetches carry their own fixture and never checked an opt-in, so a bare run hit
# the internet and failed under unrelated load. Opt in with `-m live`.
addopts = '-m "not live"'
