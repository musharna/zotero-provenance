[project]
name = "zotero-provenance"
version = "0.1.0"
description = "Record the sources a Claude Code session cites into a Zotero collection"
requires-python = ">=3.10"
dependencies = ["httpx>=0.24", "beautifulsoup4>=4.11"]

[project.optional-dependencies]
dev = ["pytest>=7", "respx>=0.20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
